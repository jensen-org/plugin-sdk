name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Protocol matches the host at the pinned ref
        run: bun run protocol:check
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run api:check
      - run: bun run docs:build
