[package]
name = "jensen-plugin-backend"
version = "0.2.0"
edition = "2024"
description = "Write the Rust backend of a Jensen plugin: JSON methods, sandboxed file access and logging, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/jensen-org/plugin-sdk"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
